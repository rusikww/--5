<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900"rel="stylesheet"/>
  </head>

  <body>
    <header class="header">
      <div class="header__center">
        <div class="header__left">
          <img class="header__icon1" src="img/logo.png" alt="text" />
          <img class="header__icon2" src="img/search.png" alt="text" />
        </div>

        <div class="header__right">
          <img class="header__icon3" src="img/menu.png" alt="text" />
          <img class="header__icon4" src="img/acc.png" alt="text" />
          
          <img class="header__icon5" src="img/cart.png" alt="text" />
        </div>
      </div>
    </header>

    <main class="main">
      <section class="section__hero">
        <div class="hero__center">
          <div class="hero__left">
            <img class="hero__img" src="img/man-hero.png" alt="" />
          </div>

          <div class="hero__right">
            <p class="hero__p_big">THE BRAND</p>
            <p class="hero__p_small">OF...</p>
          </div>
        </div>
      </section>

      <section class="section__offer">
        <div class="offer_center">
            <div class="offer_row">
                <div class="offer_small1"></div>
                <div class="offer_small2"></div>
                <div class="offer_small3"></div>
            </div>
            <div class="offer_big"></div>
        </div>
        
    </section>
      <section class="section__products"></section>
      <section class="section__feature"></section>
    </main>

    <footer class="footer">
      <div class="footer__top"></div>
      <div class="footer__bottom"></div>
    </footer>
  </body>
</html>
